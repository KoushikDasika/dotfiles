container: vllm/vllm-openai:v0.20.0-aarch64-cu130-ubuntu2404
env:
  OMP_NUM_THREADS: '4'
  VLLM_MARLIN_USE_ATOMIC_ADD: '1'
  CUDA_MANAGED_FORCE_DEVICE_ALLOC: '1'
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  VLLM_USE_DEEP_GEMM: '0'
defaults:
  tensor_parallel: 1
  host: 0.0.0.0
  max_model_len: 262144
  max_num_seqs: 8
  max_num_batched_tokens: 32768
  port: 8000
  gpu_memory_utilization: 0.8069
model: Qwen/Qwen3.6-27B-FP8
command: |
  vllm serve Qwen/Qwen3.6-27B-FP8 \
    --served-model-name Qwen/Qwen3.6-27B-FP8 qwen3.6-27b \
    --tensor-parallel-size {tensor_parallel} \
    --port {port} --host {host} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype fp8 \
    --enable-prefix-caching \
    --language-model-only \
    --async-scheduling \
    --max-cudagraph-capture-size 128 \
    --reasoning-parser qwen3 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":3}}' \
    --trust-remote-code
solo_only: true
description: vLLM serving Qwen3.6-27B-FP8 with MTP=3 on a single GB10
cluster_only: false
recipe_version: '1'
name: Qwen3.6-27B-FP8-MTP

